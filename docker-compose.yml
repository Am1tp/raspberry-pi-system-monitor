services:
  pimonitor:
    build: .
    container_name: pimonitor
    environment:
      - PORT=5000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pimonitor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pimonitor
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pimonitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - pimonitor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pimonitor-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: pimonitor-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  pihole-exporter:
    image: amonacoos/pihole6_exporter:latest
    container_name: pimonitor-pihole-exporter
    environment:
      - PIHOLE_HOST=host.docker.internal
      - PIHOLE_API_KEY=${PIHOLE_API_KEY}
      - PIHOLE_SCHEME=http
      - PIHOLE_PORT=8081
    ports:
      - "9666:9666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  cloudwatch-agent:
    image: public.ecr.aws/cloudwatch-agent/cloudwatch-agent:latest
    container_name: pimonitor-cloudwatch-agent
    environment:
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_PROFILE=default
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ./cloudwatch:/etc/cwagentconfig:ro
      - /:/hostfs:ro
    restart: unless-stopped

volumes:
  grafana-data:
