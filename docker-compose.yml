services:
  pimonitor:
    build: .
    container_name: pimonitor
    environment:
      - PORT=5000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pimonitor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pimonitor
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pimonitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - pimonitor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pimonitor-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
