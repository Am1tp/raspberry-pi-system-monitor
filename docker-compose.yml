services:
  pimonitor:
    build: .
    container_name: pimonitor
    environment:
      - PORT=5000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pimonitor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pimonitor
    restart: unless-stopped
